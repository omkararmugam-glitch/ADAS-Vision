# Default pipeline configuration.
# Every value the code reads lives here, never as a constant in a module body.
#
# Only the sections listed in Config.CACHE_KEY_SECTIONS (io, calibration,
# detector) contribute to the cache key. Changing `overlay` or `video` re-renders
# from the existing cache instead of re-running inference.

io:
  image_extensions: [".png", ".jpg", ".jpeg"]
  # Folders of stills carry no timing. State the capture rate explicitly when
  # the source is an image directory; leaving this null makes such a source an error.
  image_dir_fps: null
  # [width, height] every frame is delivered at. null adopts the first frame's
  # size. Frames of any other size are resampled to this, because the homography
  # is defined for exactly one resolution.
  canonical_size: null
  # Take video frame times from the container's presentation timestamps, so
  # variable-frame-rate recordings keep their true timing.
  use_container_timestamps: true
  start_frame: 0
  stride: 1
  max_frames: null

calibration:
  intrinsics_path: calib/intrinsics.yaml
  homography_path: calib/homography.yaml
  # Undistorting before the homography is the more accurate route, especially for
  # a wide-angle dashcam where barrel distortion is worst at the edges -- exactly
  # where distant vehicles and lane markings sit. Left off by deliberate choice;
  # the homography then absorbs whatever distortion is present. Whichever way
  # this is set, the decision is recorded in calib/homography.yaml and in the
  # cache manifest, so no result is ever ambiguous about it.
  undistort: false
  chessboard:
    # INNER corner counts, not squares.
    cols: 9
    rows: 6
    square_size_m: 0.024

# Bird's-eye window in ego metres: X right, Y forward, origin at the camera's
# ground projection.
bev:
  x_min_m: -6.0
  x_max_m: 6.0
  y_min_m: 3.0
  y_max_m: 40.0
  px_per_m: 20.0
  grid_step_m: 5.0

cache:
  root: outputs
  # Model identity is taken from the detector itself (name + weights hash),
  # not configured here, so swapping weights invalidates caches automatically.
  # null derives '<source stem>__<config hash>', so identical settings reuse the
  # same run directory instead of piling up timestamped ones.
  run_id: null

detector:
  # 'yolopv2' multi-task backbone (boxes + drivable + lane in one pass),
  # 'yolov8'  single-task baseline (boxes only; lanes come from models/lane_seg),
  # 'stub'    runs the whole pipeline with no model at all.
  kind: yolopv2
  weights: models/perception/weights/yolopv2.pt
  input_size: 640          # long side; padded to a multiple of `stride`
  stride: 32
  conf_threshold: 0.3
  iou_threshold: 0.45
  max_detections: 100
  lane_threshold: 0.5
  device: auto             # warns loudly if this lands on CPU
  half: true               # fp16 on CUDA only
  batch_size: 4
  # Stub-only knobs, ignored by the real backbone.
  score_threshold: 0.3
  seed: 0
  # Baseline backbone, used only when kind == 'yolov8'. It detects people
  # itself, so no VRU model is attached to it, and it emits no masks -- lanes
  # on that path come from models/lane_seg.
  yolov8:
    weights: models/perception/weights/yolov8n.pt
    # A missing checkpoint is fetched only when it is a standard pretrained
    # name. Anything else raises rather than quietly running other weights.
    allow_download: true

  # YOLOPv2 has no pedestrian class, and no released multi-task network in that
  # family does (HybridNets ships obj_list:['car']). Vulnerable road users
  # therefore need a second model. It emits ONLY person/bicycle/motorcycle --
  # vehicles come from YOLOPv2, and taking them from both would double-count.
  # Ignored when kind == 'yolov8'.
  vru:
    enabled: true
    architecture: fasterrcnn_mobilenet_v3_large_320_fpn
    conf_threshold: 0.5

# Sliding-window lane fitting, in bird's-eye metres.
lanes:
  n_windows: 12
  window_half_width_m: 0.6
  min_pixels_per_window: 25
  min_pixels_for_fit: 150
  min_mask_pixels: 300
  # Must reach past the adjacent lane's outer edge: for a 3.5 m lane that sits
  # at 1.75 + 3.5 = 5.25 m, so a 5 m search finds no adjacent lanes at all.
  search_half_width_m: 7.0
  min_lane_width_m: 2.2
  max_lane_width_m: 5.0
  eval_distance_m: 10.0
  adjacent_lanes: true

# Presentation only -- excluded from the cache key.
overlay:
  box_thickness: 2
  lane_thickness: 4
  mask_alpha: 0.35
  # The raw lane mask under the fitted curves is the visual check that
  # calibration and fitting agree. Keep it on.
  show_lane_mask: true
  lane_mask_alpha: 0.85
  font_scale: 0.5
  hud: true
  hud_width_px: 380

video:
  fourcc: mp4v
  # null inherits the emitted frame rate (source fps / io.stride).
  fps: null
